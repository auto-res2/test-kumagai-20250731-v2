name: Run Experiments

on:
  push:
    branches: [ test, test-2, test-3, test-4 ]
  workflow_dispatch:

jobs:
  run-experiments:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create results directory
      run: mkdir -p results
    
    - name: Run quick test
      run: |
        cd src/experiments
        python quick_test.py || echo "Quick test not found, skipping"
    
    - name: Run experiments
      timeout-minutes: 15
      run: |
        cd src/experiments
        # Find and run the main experiment file
        if [ -f "autogelu_experiments.py" ]; then
          echo "Running AutoGELU experiments..."
          python autogelu_experiments.py > ../../results/experiment_output.txt 2>&1
        elif [ -f "quantum_optimization_experiments.py" ]; then
          echo "Running Quantum optimization experiments..."
          python quantum_optimization_experiments.py > ../../results/experiment_output.txt 2>&1
        elif [ -f "federated_learning_experiments.py" ]; then
          echo "Running Federated learning experiments..."
          python federated_learning_experiments.py > ../../results/experiment_output.txt 2>&1
        elif [ -f "gnn_protein_experiments.py" ]; then
          echo "Running GNN protein experiments..."
          python gnn_protein_experiments.py > ../../results/experiment_output.txt 2>&1
        else
          echo "No experiment file found, running any Python file..."
          python *.py > ../../results/experiment_output.txt 2>&1
        fi
    
    - name: List generated files
      run: |
        echo "=== Generated files ==="
        ls -la src/experiments/*.pdf || echo "No PDF files generated"
        echo "=== Results directory ==="
        ls -la results/
    
    - name: Upload experiment results
      uses: actions/upload-artifact@v4
      with:
        name: experiment-results
        path: |
          src/experiments/*.pdf
          results/experiment_output.txt
      if: always()
    
    - name: Upload experiment plots
      uses: actions/upload-artifact@v4
      with:
        name: experiment-plots
        path: src/experiments/*.pdf
      if: always()
    
    - name: Display experiment output
      run: |
        echo "=== Experiment Output ==="
        cat results/experiment_output.txt || echo "No output file found"
      if: always()