name: Run Experiments

on:
  push:
    branches: [ main, test, test-2, test-3, test-4 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-experiments:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision numpy matplotlib scikit-learn
    
    - name: Create results directory
      run: mkdir -p results
    
    - name: Run quantum_optimization_experiments.py
      timeout-minutes: 15
      run: |
        cd src/experiments
        echo "=== Running quantum_optimization_experiments.py for branch test-2 ==="
        python quantum_optimization_experiments.py 2>&1 | tee ../../results/experiment_output.txt
        
        # Create summary
        echo "=== EXPERIMENT SUMMARY ===" > ../../results/summary.txt
        echo "Branch: test-2" >> ../../results/summary.txt
        echo "Experiment: quantum_optimization_experiments.py" >> ../../results/summary.txt
        echo "Timestamp: $(date)" >> ../../results/summary.txt
        echo "" >> ../../results/summary.txt
        echo "=== Last 100 lines of output ===" >> ../../results/summary.txt
        tail -100 ../../results/experiment_output.txt >> ../../results/summary.txt
    
    - name: List results
      if: always()
      run: |
        echo "Contents of results directory:"
        ls -la results/
        echo ""
        echo "Contents of current directory:"
        ls -la
        echo ""
        if [ -f results/summary.txt ]; then
          echo "Summary contents:"
          cat results/summary.txt
        fi
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: results-test-2-${{ github.run_id }}
        path: |
          results/
          *.pdf
          *.png
