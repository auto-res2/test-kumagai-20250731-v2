name: Run Experiments

on:
  push:
    branches: [ main, test, test-2, test-3, test-4 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-experiments:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision numpy matplotlib scikit-learn
    
    - name: Create results directory
      run: mkdir -p results
    
    - name: Run quantum_optimization_experiments.py
      timeout-minutes: 15
      run: |
        cd src/experiments
        echo "Running quantum_optimization_experiments.py for branch test-2..."
        python quantum_optimization_experiments.py > ../../results/experiment_output.txt 2>&1
        echo "Experiment completed"
        
        # Also save a summary
        echo "Branch: test-2" > ../../results/experiment_summary.txt
        echo "Experiment: quantum_optimization_experiments.py" >> ../../results/experiment_summary.txt
        echo "Timestamp: $(date)" >> ../../results/experiment_summary.txt
        echo "" >> ../../results/experiment_summary.txt
        tail -50 ../../results/experiment_output.txt >> ../../results/experiment_summary.txt
    
    - name: Upload results
      uses: actions/upload-artifact@v3
      with:
        name: experiment-results-test-2
        path: |
          results/
          src/
    
    - name: Upload plots
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: experiment-plots-test-2
        path: |
          *.pdf
          *.png
