name: Run Experiments

on:
  push:
    branches: [ test ]
  workflow_dispatch:

jobs:
  run-experiments:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create results directory
      run: mkdir -p results
    
    - name: Run quick test
      run: |
        cd src/experiments
        python quick_test.py
    
    - name: Run experiments
      timeout-minutes: 15
      run: |
        cd src/experiments
        # Run in test mode with reduced epochs for faster completion
        python autogelu_experiments.py > ../../results/experiment_output.txt 2>&1
    
    - name: List generated files
      run: |
        echo "=== Generated files ==="
        ls -la src/experiments/*.pdf || echo "No PDF files generated"
        echo "=== Results directory ==="
        ls -la results/
    
    - name: Upload experiment results
      uses: actions/upload-artifact@v4
      with:
        name: experiment-results
        path: |
          src/experiments/*.pdf
          results/experiment_output.txt
      if: always()
    
    - name: Upload experiment plots
      uses: actions/upload-artifact@v4
      with:
        name: experiment-plots
        path: src/experiments/*.pdf
      if: always()
    
    - name: Display experiment output
      run: |
        echo "=== Experiment Output ==="
        cat results/experiment_output.txt || echo "No output file found"
      if: always()