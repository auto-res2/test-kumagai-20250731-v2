name: Run Experiments
on: [push]

jobs:
  experiment:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy matplotlib
    
    - name: Create results directory
      run: mkdir -p results
    
    - name: Run experiments
      run: |
        cd src/experiments
        
        # CRITICAL: Check for branch-specific experiments FIRST (guide section 2.1)
        if [ -f "vision_transformer_experiments.py" ] && [ "${{ github.ref }}" == "refs/heads/test-6-vision-transformers" ]; then
            echo "Running Vision Transformer experiments..."
            python vision_transformer_experiments.py > ../../results/experiment_output.txt 2>&1
            cp *.json ../../results/ 2>/dev/null || true
        elif [ -f "autogelu_experiments.py" ]; then
            echo "Running AutoGELU experiments..."
            python autogelu_experiments.py > ../../results/experiment_output.txt 2>&1
        else
            echo "No experiments found!"
            exit 1
        fi
    
    - name: Display results
      run: |
        echo "=== Experiment Output ==="
        head -50 results/experiment_output.txt || echo "No output found"
    
    - name: Upload results
      uses: actions/upload-artifact@v4  # CRITICAL: v4, not v3! (guide section 2.2)
      with:
        name: experiment-results
        path: results/
        retention-days: 7
