name: Run Experiments
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
    - run: |
        cd src/experiments
        if [ -f "guide_validation_exp.py" ]; then
            python guide_validation_exp.py
        fi
    - uses: actions/upload-artifact@v4
      with:
        name: results
        path: results/
